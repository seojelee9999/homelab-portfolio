apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portfolio
resources:
  - namespace.yaml
  - secrets.yaml
  - mariadb.yaml
  - bookstack.yaml
  - httproute.yaml
configMapGenerator:
  - name: portfolio-bootstrap
    files:
      - bootstrap/99-portfolio.sh
      - bootstrap/initialize.php
      - bootstrap/configure.php
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
