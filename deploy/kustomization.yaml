apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portfolio
resources:
  - namespace.yaml
  - secrets.yaml
  - mariadb.yaml
  - bookstack.yaml
  - httproute.yaml
configMapGenerator:
  - name: portfolio-bootstrap
    files:
      - bootstrap/99-portfolio.sh
      - bootstrap/initialize.php
      - bootstrap/configure.php
      - bootstrap/authoring.php
  - name: portfolio-content
    files:
      - content/build.md
      - content/troubleshooting.md
      - content/learning.md
      - content/stack.md
  - name: portfolio-theme
    files:
      - theme/lang/ko/entities.php
      - theme/common/view-blocks.blade.php
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
