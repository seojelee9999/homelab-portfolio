apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portfolio
resources:
  - namespace.yaml
  - secrets.yaml
  - mariadb.yaml
  - bookstack.yaml
  - httproute.yaml
configMapGenerator:
  - name: portfolio-bootstrap
    files:
      - bootstrap/99-portfolio.sh
      - bootstrap/initialize.php
      - bootstrap/configure.php
      - bootstrap/authoring.php
  - name: portfolio-content
    files:
      - content/build.md
      - content/troubleshooting.md
      - content/learning.md
      - content/stack.md
  - name: portfolio-theme
    files:
      - theme/lang/ko/entities.php
      - theme/common/view-blocks.blade.php
      - theme/functions.php
      - dashboard.blade.php=theme/home/specific-page.blade.php
      - head.blade.php=theme/notes/head.blade.php
      - icon.blade.php=theme/notes/icon.blade.php
      - topology.blade.php=theme/notes/topology.blade.php
      - theme/public/notes.css
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
