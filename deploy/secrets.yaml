apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portfolio-bookstack
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: portfolio-bookstack
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: APP_KEY
      remoteRef:
        key: /homelab/portfolio/APP_KEY
    - secretKey: DB_PASSWORD
      remoteRef:
        key: /homelab/portfolio/DB_PASSWORD
    - secretKey: INITIAL_ADMIN_EMAIL
      remoteRef:
        key: /homelab/portfolio/INITIAL_ADMIN_EMAIL
    - secretKey: INITIAL_ADMIN_PASSWORD
      remoteRef:
        key: /homelab/portfolio/INITIAL_ADMIN_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portfolio-mariadb-admin
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: portfolio-mariadb-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: MARIADB_ROOT_PASSWORD
      remoteRef:
        key: /homelab/portfolio/MARIADB_ROOT_PASSWORD
