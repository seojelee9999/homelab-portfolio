apiVersion: v1
kind: Service
metadata:
  name: portfolio-mariadb
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  clusterIP: None
  selector:
    app: portfolio-mariadb
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portfolio-mariadb-data
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-database
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: portfolio-mariadb
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  serviceName: portfolio-mariadb
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-mariadb
  template:
    metadata:
      labels:
        app: portfolio-mariadb
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mariadb
          image: mariadb:11.4.13
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: TZ
              value: Asia/Seoul
            - name: MARIADB_DATABASE
              value: bookstack
            - name: MARIADB_USER
              value: bookstack
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portfolio-bookstack
                  key: DB_PASSWORD
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portfolio-mariadb-admin
                  key: MARIADB_ROOT_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          startupProbe:
            exec:
              command: [healthcheck.sh, --connect, --innodb_initialized]
            failureThreshold: 90
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: [healthcheck.sh, --connect, --innodb_initialized]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [healthcheck.sh, --connect]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: portfolio-mariadb-data
